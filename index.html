<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <!-- 'unsafe-eval' is required by UI Design Mode's Logic tab: the live preview runs the
         user's own authored behavior script via `new Function(...)` (the real JS engine,
         rather than a hand-rolled interpreter — see lib/uiDesign/scriptLang/sandboxRuntime.ts)
         so preview semantics are trustworthy for free. The script being evaluated is always the
         user's own local project data, never remote/network content. -->
    <!-- connect-src includes %VITE_SERVER_IP% (Vite's HTML env-variable replacement, kept in
         sync with .env's VITE_SERVER_IP automatically) so the login/signup HTTP client
         (src/lib/http/httpClient.ts) is allowed to reach the configured backend — without an
         explicit connect-src, default-src 'self' would silently block that fetch(). -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self' %VITE_SERVER_IP%;"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Kibo  Studio</title>
  </head>
  <body class="bg-studio-bg text-studio-text antialiased overflow-hidden">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
